name: Build & Package — jellyfin-info-popup-extention

# =============================================================================
#  CE WORKFLOW EST UNIQUEMENT pour la CI (validation build sur push/PR).
#
#  POURQUOI pas de déclenchement sur les releases :
#    Le workflow `make release-*` crée la GitHub Release et uploade le ZIP
#    compilé localement. Si ce workflow se déclenchait sur `release: created`,
#    il recompilerait le plugin dans un environnement CI différent (ubuntu runner
#    ≠ machine locale) et uploaderait un ZIP concurrent. Même avec un nom
#    différent, cela crée une condition de race dans le CDN GitHub et peut
#    provoquer un checksum mismatch dans manifest.json → Jellyfin refuse l'install.
#
#  Pour publier une release, utiliser : make release-patch / release-minor / release-major
#
#  v4.1.0.0 : la build matrix couvre les deux variants Jellyfin (10.10, 10.11).
# =============================================================================

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - { name: "jf10.10", csproj: "Jellyfin.Plugin.InfoPopup.jf10.10.csproj" }
          - { name: "jf10.11", csproj: "Jellyfin.Plugin.InfoPopup.jf10.11.csproj" }
    name: Build ${{ matrix.variant.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (8 + 9)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore (${{ matrix.variant.name }})
        run: dotnet restore "Jellyfin.Plugin.InfoPopup/${{ matrix.variant.csproj }}"

      - name: Build Release (${{ matrix.variant.name }})
        run: |
          dotnet build "Jellyfin.Plugin.InfoPopup/${{ matrix.variant.csproj }}" \
            --configuration Release --no-restore

      - name: Publish (${{ matrix.variant.name }})
        run: |
          dotnet publish "Jellyfin.Plugin.InfoPopup/${{ matrix.variant.csproj }}" \
            --configuration Release \
            --output "./publish-${{ matrix.variant.name }}" \
            --no-build

      - name: Upload artifact (${{ matrix.variant.name }})
        uses: actions/upload-artifact@v4
        with:
          name: InfoPopup-Plugin-${{ matrix.variant.name }}
          path: ./publish-${{ matrix.variant.name }}/Jellyfin.Plugin.InfoPopup.dll
