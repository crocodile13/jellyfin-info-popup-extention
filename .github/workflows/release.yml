name: Release — Build, Pack & Publish (Manuel)

# =============================================================================
#  CE WORKFLOW EST MANUEL UNIQUEMENT (workflow_dispatch).
#
#  POURQUOI pas de déclenchement automatique sur les tags :
#    Le workflow `make release-*` pousse un tag, crée la GitHub Release et
#    uploade les ZIPs locaux. Si ce workflow se déclenche sur le même tag, il
#    recompile dans un environnement différent (ubuntu-latest runner ≠ machine
#    locale) et écrase les ZIPs avec des binaires différents. Résultat : les
#    checksums dans manifest.json ne correspondent plus aux ZIPs servis par
#    GitHub → Jellyfin refuse l'installation.
#
#  QUAND utiliser ce workflow :
#    - En dernier recours si la release locale a échoué
#    - Pour vérifier que les variants compilent correctement en CI
#    - JAMAIS en même temps qu'un `make release-*` local sur le même tag
#
#  FLOW NORMAL : utiliser `make release-patch / release-minor / release-major`
#
#  v4.1.0.0 : multi-target — chaque variant produit son propre ZIP avec son
#  propre suffixe. Le job builde et upload les deux en parallèle.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de version existant (ex: v1.2.3.0) — le tag doit déjà exister'
        required: true

jobs:
  release:
    name: Package & Publish ${{ matrix.variant.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        variant:
          - { name: "jf10.10", csproj: "Jellyfin.Plugin.InfoPopup.jf10.10.csproj" }
          - { name: "jf10.11", csproj: "Jellyfin.Plugin.InfoPopup.jf10.11.csproj" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Déterminer la version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          # Strip optional -dev suffix for the bare version number
          VERSION="${VERSION%-dev}"
          ZIP_SUFFIX=""
          if [[ "$TAG" == *-dev ]]; then ZIP_SUFFIX="-dev"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=infopopup_${VERSION}-${{ matrix.variant.name }}${ZIP_SUFFIX}.zip" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION  Variant : ${{ matrix.variant.name }}"

      - name: Setup .NET (8 + 9)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore (${{ matrix.variant.name }})
        run: dotnet restore "Jellyfin.Plugin.InfoPopup/${{ matrix.variant.csproj }}"

      - name: Build Release (${{ matrix.variant.name }})
        run: |
          dotnet build "Jellyfin.Plugin.InfoPopup/${{ matrix.variant.csproj }}" \
            --configuration Release --no-restore

      - name: Publish (${{ matrix.variant.name }})
        run: |
          dotnet publish "Jellyfin.Plugin.InfoPopup/${{ matrix.variant.csproj }}" \
            --configuration Release \
            --output ./publish \
            --no-build

      - name: Créer le ZIP
        id: zip
        run: |
          mkdir -p dist
          cd publish
          zip -j ../dist/${{ steps.version.outputs.zip_name }} Jellyfin.Plugin.InfoPopup.dll
          cd ..
          CHECKSUM=$(md5sum dist/${{ steps.version.outputs.zip_name }} | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "zip_path=dist/${{ steps.version.outputs.zip_name }}" >> "$GITHUB_OUTPUT"
          echo "Checksum MD5 (${{ matrix.variant.name }}) : $CHECKSUM"

      - name: Uploader le ZIP sur la release existante
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.zip.outputs.zip_path }}#${{ steps.version.outputs.zip_name }}" \
            --repo "${{ github.repository }}" \
            --clobber
          echo "✓ ZIP ${{ matrix.variant.name }} uploadé. MD5 CI : ${{ steps.zip.outputs.checksum }}"
          echo ""
          echo "⚠ IMPORTANT : si vous utilisez ce workflow manuellement,"
          echo "  relancez ensuite 'make manifest-update && make push' en local"
          echo "  pour mettre à jour les checksums dans le manifest."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
